name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C target-feature=+fp16"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Archive
        shell: bash
        run: |
          mkdir -p package
          cp target/${{ matrix.target }}/release/rembg-rs package/
          cp README.md LICENSE package/
          tar -C package -czf rembg-rs-$GITHUB_REF_NAME-${{ matrix.target }}.tar.gz .
          if command -v sha256sum >/dev/null; then
            sha256sum rembg-rs-$GITHUB_REF_NAME-${{ matrix.target }}.tar.gz > rembg-rs-$GITHUB_REF_NAME-${{ matrix.target }}.sha256
          else
            shasum -a 256 rembg-rs-$GITHUB_REF_NAME-${{ matrix.target }}.tar.gz > rembg-rs-$GITHUB_REF_NAME-${{ matrix.target }}.sha256
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: rembg-rs-${{ matrix.target }}
          path: |
            rembg-rs-*.tar.gz
            rembg-rs-*.sha256
          if-no-files-found: error

  cuda-package:
    runs-on: ubuntu-22.04
    container: nvidia/cuda:12.1.1-devel-ubuntu22.04
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl build-essential pkg-config ca-certificates git
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-gnu-cuda
      - name: Build CUDA binary
        env:
          CUDA_COMPUTE_CAP: "75"
        run: cargo build --locked --release --features cuda
      - name: Archive
        shell: bash
        run: |
          mkdir -p package
          cp target/release/rembg-rs package/
          cp README.md LICENSE package/
          archive="rembg-rs-cuda-$GITHUB_REF_NAME-x86_64-unknown-linux-gnu.tar.gz"
          tar -C package -czf "$archive" .
          sha256sum "$archive" > "$archive.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: rembg-rs-cuda-x86_64-unknown-linux-gnu
          path: |
            rembg-rs-cuda-*.tar.gz
            rembg-rs-cuda-*.sha256
          if-no-files-found: error

  # Built inside Arch against Arch's own `cuda` package: the Debian build above
  # links the CUDA 12 runtime, and Arch ships a newer CUDA with different
  # sonames, so a binary built there fails to start on Arch. Rolling Arch can
  # break a CUDA build before anything here changes, so a failure is not fatal:
  # the Arch CUDA package then falls back to the generic CUDA archive.
  cuda-package-arch:
    runs-on: ubuntu-latest
    continue-on-error: true
    container: archlinux:base-devel
    steps:
      - name: Install build tools
        run: pacman -Sy --noconfirm --needed rust cuda git
      - uses: actions/checkout@v4
      - name: Build Arch CUDA binary
        shell: bash
        env:
          # 80, not 75: below 8.0 candle-kernels redefines __hmax_nan/__hmin_nan,
          # which the newer cuda_fp16.h in Arch's CUDA already defines.
          CUDA_COMPUTE_CAP: "80"
        run: |
          export PATH=/opt/cuda/bin:$PATH CUDA_PATH=/opt/cuda CUDA_HOME=/opt/cuda
          # cudarc refuses toolkits newer than it knows (Arch currently ships
          # 13.5, cudarc 0.19.10 stops at 13.4). Report the newest supported
          # version: major*1000+minor*10. The headers are backward compatible,
          # and the build uses only what candle-kernels compiles itself.
          cudarc_version=$(nvcc --version \
            | sed -n 's/.*release \([0-9]*\)\.\([0-9]*\).*/\1 \2/p' \
            | awk '{v=$1*1000+$2*10; print (v>13040)?13040:v}')
          export CUDARC_CUDA_VERSION="$cudarc_version"
          cargo build --locked --release --features cuda
      - name: Archive
        shell: bash
        run: |
          mkdir -p package
          cp target/release/rembg-rs package/
          cp README.md LICENSE package/
          archive="rembg-rs-cuda-arch-$GITHUB_REF_NAME-x86_64-unknown-linux-gnu.tar.gz"
          tar -C package -czf "$archive" .
          sha256sum "$archive" > "$archive.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: rembg-rs-cuda-arch-x86_64-unknown-linux-gnu
          path: |
            rembg-rs-cuda-arch-*.tar.gz
            rembg-rs-cuda-arch-*.sha256
          if-no-files-found: error

  packages:
    needs: [package, cuda-package, cuda-package-arch]
    # The Arch CUDA build may fail without blocking the release (see its job).
    if: ${{ !cancelled() && needs.package.result == 'success' && needs.cuda-package.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: rembg-rs-*
          merge-multiple: true
      - name: Build Debian packages
        shell: bash
        run: |
          set -euo pipefail
          version=$(printf '%s' "$GITHUB_REF_NAME" | sed 's/^v//')
          mkdir -p debs
          build_deb() {
            local target="$1" arch="$2" glibc="$3"
            local src="stage/$arch/src"
            local root="stage/$arch/root"
            mkdir -p "$src"
            tar -xzf "dist/rembg-rs-$GITHUB_REF_NAME-$target.tar.gz" -C "$src"
            install -Dm755 "$src/rembg-rs" "$root/usr/bin/rembg-rs"
            install -Dm644 "$src/README.md" "$root/usr/share/doc/rembg-rs/README.md"
            install -Dm644 "$src/LICENSE" "$root/usr/share/doc/rembg-rs/LICENSE"
            local size
            size=$(du -ks "$root/usr" | cut -f1)
            install -d "$root/DEBIAN"
            sed -e "s/@VERSION@/$version/" \
                -e "s/@ARCH@/$arch/" \
                -e "s/@GLIBC@/$glibc/" \
                -e "s/@INSTALLED_SIZE@/$size/" \
                packaging/debian/control > "$root/DEBIAN/control"
            if grep -qE '@[A-Z_]+@' "$root/DEBIAN/control"; then
              echo "::error::Unfilled Debian control placeholder" >&2
              exit 1
            fi
            dpkg-deb --root-owner-group --build "$root" "debs/rembg-rs_$version-1_$arch.deb"
          }
          build_deb x86_64-unknown-linux-gnu amd64 2.35
          build_deb aarch64-unknown-linux-gnu arm64 2.39
          cuda_src="stage/cuda/src"
          cuda_root="stage/cuda/root"
          mkdir -p "$cuda_src"
          tar -xzf "dist/rembg-rs-cuda-$GITHUB_REF_NAME-x86_64-unknown-linux-gnu.tar.gz" -C "$cuda_src"
          install -Dm755 "$cuda_src/rembg-rs" "$cuda_root/usr/bin/rembg-rs"
          install -Dm644 "$cuda_src/README.md" "$cuda_root/usr/share/doc/rembg-rs-cuda/README.md"
          install -Dm644 "$cuda_src/LICENSE" "$cuda_root/usr/share/doc/rembg-rs-cuda/LICENSE"
          cuda_size=$(du -ks "$cuda_root/usr" | cut -f1)
          install -d "$cuda_root/DEBIAN"
          sed -e "s/@VERSION@/$version/" \
              -e "s/@INSTALLED_SIZE@/$cuda_size/" \
              packaging/debian/control-cuda > "$cuda_root/DEBIAN/control"
          if grep -qE '@[A-Z_]+@' "$cuda_root/DEBIAN/control"; then
            echo "::error::Unfilled CUDA Debian control placeholder" >&2
            exit 1
          fi
          dpkg-deb --root-owner-group --build "$cuda_root" "debs/rembg-rs-cuda_$version-1_amd64.deb"
          (cd debs && for file in *.deb; do sha256sum "$file" > "$file.sha256"; done)
      - name: Build Arch package
        shell: bash
        run: |
          set -euo pipefail
          version=$(printf '%s' "$GITHUB_REF_NAME" | sed 's/^v//')
          archive="rembg-rs-$GITHUB_REF_NAME-x86_64-unknown-linux-gnu.tar.gz"
          archive_sha=$(sha256sum "dist/$archive" | cut -d' ' -f1)
          mkdir -p pkg
          sed -e "s/@VERSION@/$version/g" \
              -e "s/@SHA_LINUX_X86_64@/$archive_sha/g" \
              packaging/pacman/PKGBUILD > pkg/PKGBUILD
          cp "dist/$archive" "pkg/rembg-rs-$version-x86_64.tar.gz"
          docker run --rm -v "$PWD/pkg:/pkg" -e "OWNER=$(id -u):$(id -g)" archlinux:base-devel bash -c '
            set -eu
            pacman -Sy --noconfirm --needed ca-certificates
            useradd -m builder
            chown -R builder /pkg
            su builder -c "cd /pkg && makepkg --cleanbuild --force --nodeps -p PKGBUILD"
            chown -R "$OWNER" /pkg
          '
          versioned_package="pkg/rembg-rs-$version-1-x86_64.pkg.tar.zst"
          test -f "$versioned_package"
          (cd pkg && sha256sum "rembg-rs-$version-1-x86_64.pkg.tar.zst" > "rembg-rs-$version-1-x86_64.pkg.tar.zst.sha256")
          cuda_archive="rembg-rs-cuda-arch-$GITHUB_REF_NAME-x86_64-unknown-linux-gnu.tar.gz"
          cuda_prefix="rembg-rs-cuda-arch"
          if [ ! -f "dist/$cuda_archive" ]; then
            echo "::warning::no Arch-built CUDA archive; the Arch CUDA package falls back to the CUDA 12 build"
            cuda_prefix="rembg-rs-cuda"
            cuda_archive="$cuda_prefix-$GITHUB_REF_NAME-x86_64-unknown-linux-gnu.tar.gz"
          fi
          cuda_sha=$(sha256sum "dist/$cuda_archive" | cut -d' ' -f1)
          mkdir -p pkg-cuda
          sed -e "s/@VERSION@/$version/g" \
              -e "s/@ARCHIVE_PREFIX@/$cuda_prefix/g" \
              -e "s/@SHA_LINUX_X86_64_CUDA@/$cuda_sha/g" \
              packaging/pacman/PKGBUILD-cuda > pkg-cuda/PKGBUILD
          if grep -qE '@[A-Z_]+@' pkg-cuda/PKGBUILD; then
            echo "::error::Unfilled CUDA PKGBUILD placeholder" >&2
            exit 1
          fi
          cp "dist/$cuda_archive" "pkg-cuda/rembg-rs-cuda-$version-x86_64.tar.gz"
          docker run --rm -v "$PWD/pkg-cuda:/pkg" -e "OWNER=$(id -u):$(id -g)" archlinux:base-devel bash -c '
            set -eu
            useradd -m builder
            chown -R builder /pkg
            su builder -c "cd /pkg && makepkg --cleanbuild --force --nodeps -p PKGBUILD"
            chown -R "$OWNER" /pkg
          '
          test -f "pkg-cuda/rembg-rs-cuda-$version-1-x86_64.pkg.tar.zst"
          (cd pkg-cuda && sha256sum "rembg-rs-cuda-$version-1-x86_64.pkg.tar.zst" > "rembg-rs-cuda-$version-1-x86_64.pkg.tar.zst.sha256")
          cp pkg-cuda/*.pkg.tar.zst pkg-cuda/*.pkg.tar.zst.sha256 pkg/
      - name: Check packages
        shell: bash
        run: |
          set -euo pipefail
          version=$(printf '%s' "$GITHUB_REF_NAME" | sed 's/^v//')
          dpkg-deb --info "debs/rembg-rs_$version-1_amd64.deb"
          # The listing goes to a file rather than straight into `grep -q`:
          # grep exits at the first match, the tar subprocess keeps writing and
          # dies with "stdout: write error", and pipefail then fails the step.
          check_deb_contents() {
            local deb="$1" listing
            listing=$(mktemp)
            dpkg-deb --contents "$deb" > "$listing"
            grep -q './usr/bin/rembg-rs' "$listing"
            rm -f "$listing"
          }
          check_deb_contents "debs/rembg-rs_$version-1_amd64.deb"
          test "$(dpkg-deb --field "debs/rembg-rs_$version-1_arm64.deb" Architecture)" = arm64
          test "$(dpkg-deb --field "debs/rembg-rs-cuda_$version-1_amd64.deb" Conflicts)" = rembg-rs
          check_deb_contents "debs/rembg-rs-cuda_$version-1_amd64.deb"
          docker run --rm -v "$PWD/pkg:/pkg" archlinux:base-devel bash -c "bsdtar -tf /pkg/rembg-rs-$version-1-x86_64.pkg.tar.zst | grep -qx 'usr/bin/rembg-rs'"
          docker run --rm -v "$PWD/pkg:/pkg" archlinux:base-devel bash -c "bsdtar -tf /pkg/rembg-rs-cuda-$version-1-x86_64.pkg.tar.zst | grep -qx 'usr/bin/rembg-rs'"
      - uses: actions/upload-artifact@v4
        with:
          name: debian-packages
          path: |
            debs/*.deb
            debs/*.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pacman-package
          path: |
            pkg/*.pkg.tar.zst
            pkg/*.sha256
          if-no-files-found: error

  release:
    needs: [package, cuda-package, packages]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: rembg-rs-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          path: dist
          name: debian-packages
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          path: dist
          name: pacman-package
          merge-multiple: true
      - name: Verify checksums
        run: cd dist && sha256sum -c *.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  crates-io:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish crate
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish --locked

  homebrew:
    needs: [package, release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: rembg-rs-*
          merge-multiple: true
      - name: Render formula
        if: env.TAP_TOKEN != ''
        run: |
          version=$(printf '%s' "$GITHUB_REF_NAME" | sed 's/^v//')
          sha() { sha256sum "dist/rembg-rs-$GITHUB_REF_NAME-$1.tar.gz" | cut -d' ' -f1; }
          sed -e "s/@VERSION@/$version/g" \
              -e "s/@SHA_MACOS_ARM64@/$(sha aarch64-apple-darwin)/" \
              -e "s/@SHA_LINUX_X86_64@/$(sha x86_64-unknown-linux-gnu)/" \
              -e "s/@SHA_LINUX_ARM64@/$(sha aarch64-unknown-linux-gnu)/" \
              packaging/homebrew/rembg-rs.rb > /tmp/rembg-rs.rb
          if grep -qE '@[A-Z_]+@' /tmp/rembg-rs.rb; then
            echo "::error::Unfilled Homebrew formula placeholder" >&2
            exit 1
          fi
      - name: Publish formula
        if: env.TAP_TOKEN != ''
        run: |
          version=$(printf '%s' "$GITHUB_REF_NAME" | sed 's/^v//')
          git clone --depth 1 "https://x-access-token:$TAP_TOKEN@github.com/apiplant/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp /tmp/rembg-rs.rb tap/Formula/rembg-rs.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/rembg-rs.rb
          git diff --cached --quiet && exit 0
          git commit -m "rembg-rs $version"
          git push

  apt:
    needs: [packages, release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    container: debian:bookworm
    env:
      APT_REPO_TOKEN: ${{ secrets.APT_REPO_TOKEN }}
    steps:
      - name: Install repository tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends dpkg-dev apt-utils gnupg git ca-certificates
      - uses: actions/checkout@v4
        with:
          path: source
      - uses: actions/download-artifact@v4
        with:
          path: debs
          name: debian-packages
      - name: Import signing key
        if: env.APT_REPO_TOKEN != ''
        env:
          GPG_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          test -n "$GPG_KEY" || { echo "::error::APT signing key is missing" >&2; exit 1; }
          printf '%s\n' "$GPG_KEY" | gpg --batch --import
          gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}' > /tmp/keyid
          test -s /tmp/keyid
      - name: Add packages to repository
        if: env.APT_REPO_TOKEN != ''
        run: |
          git clone --depth 1 "https://x-access-token:$APT_REPO_TOKEN@github.com/apiplant/apt.git" repo
          mkdir -p repo/pool/main/r/rembg-rs
          cp debs/*.deb repo/pool/main/r/rembg-rs/
      - name: Generate package indices
        if: env.APT_REPO_TOKEN != ''
        working-directory: repo
        run: |
          for arch in amd64 arm64; do
            dir="dists/stable/main/binary-$arch"
            mkdir -p "$dir"
            dpkg-scanpackages --arch "$arch" pool /dev/null > "$dir/Packages"
            gzip -9kf "$dir/Packages"
          done
          apt-ftparchive -c ../source/packaging/apt/apt-ftparchive.conf release dists/stable > /tmp/Release
          mv /tmp/Release dists/stable/Release
      - name: Sign and publish repository
        if: env.APT_REPO_TOKEN != ''
        working-directory: repo
        env:
          GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          keyid=$(cat /tmp/keyid)
          set --
          if [ -n "$GPG_PASSPHRASE" ]; then set -- --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE"; fi
          gpg --batch --yes "$@" --local-user "$keyid" --clearsign -o dists/stable/InRelease dists/stable/Release
          gpg --batch --yes "$@" --local-user "$keyid" --detach-sign --armor -o dists/stable/Release.gpg dists/stable/Release
          gpg --export "$keyid" > apiplant.gpg
          cp apiplant.gpg apiplant-archive-keyring.gpg
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "rembg-rs $GITHUB_REF_NAME"
          git push

  pacman:
    needs: [packages, release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      PACMAN_REPO_TOKEN: ${{ secrets.PACMAN_REPO_TOKEN }}
    steps:
      - name: Install repository tools
        run: pacman -Sy --noconfirm --needed git gnupg ca-certificates
      - uses: actions/download-artifact@v4
        with:
          path: dist
          name: pacman-package
      - name: Import signing key
        if: env.PACMAN_REPO_TOKEN != ''
        env:
          GPG_KEY: ${{ secrets.PACMAN_GPG_PRIVATE_KEY }}
        run: |
          test -n "$GPG_KEY" || { echo "::error::Pacman signing key is missing" >&2; exit 1; }
          printf '%s\n' "$GPG_KEY" | gpg --batch --import
          gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}' > /tmp/keyid
          test -s /tmp/keyid
      - name: Add package to repository
        if: env.PACMAN_REPO_TOKEN != ''
        run: |
          git clone --depth 1 "https://x-access-token:$PACMAN_REPO_TOKEN@github.com/apiplant/pacman.git" repo
          mkdir -p repo/x86_64
          cp dist/*.pkg.tar.zst repo/x86_64/
      - name: Sign, index and publish repository
        if: env.PACMAN_REPO_TOKEN != ''
        working-directory: repo
        env:
          GPG_PASSPHRASE: ${{ secrets.PACMAN_GPG_PASSPHRASE }}
        run: |
          keyid=$(cat /tmp/keyid)
          sign() {
            rm -f "$1.sig"
            if [ -n "$GPG_PASSPHRASE" ]; then
              gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --local-user "$keyid" --detach-sign "$1"
            else
              gpg --batch --yes --local-user "$keyid" --detach-sign "$1"
            fi
          }
          packages=$(printf '%s\n' "$PWD/x86_64"/*.pkg.tar.zst)
          for pkg in $packages; do sign "$pkg"; done
          repo-add --include-sigs x86_64/apiplant.db.tar.zst $packages
          for name in apiplant.db apiplant.files; do cp --remove-destination "x86_64/$name.tar.zst" "x86_64/$name"; done
          sign x86_64/apiplant.db
          sign x86_64/apiplant.files
          gpg --armor --export "$keyid" > apiplant.gpg
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "rembg-rs $GITHUB_REF_NAME"
          git push
