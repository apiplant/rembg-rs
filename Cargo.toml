[package]
name = "rembg-rs"
version = "0.1.1"
edition = "2024"
description = "Rust host for Bria RMBG-3.0 background removal"
license = "MIT"
readme = "README.md"
repository = "https://github.com/apiplant/rembg-rs"
homepage = "https://rembg-rs.apiplant.com"
include = ["Cargo.toml", "README.md", "LICENSE", "src/**", "ui/index.html", "!website/**", "!packaging/**"]

[features]
default = []
cuda = [
    "candle-core/cuda",
    "candle-nn/cuda",
    "candle-transformers/cuda",
    "dep:candle-flash-attn",
]
cuda-cudnn = [
    "cuda",
    "candle-core/cudnn",
    "candle-nn/cudnn",
    "candle-transformers/cudnn",
]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]

[dependencies]
anyhow = "1"
base64 = "0.22"
candle-core = "0.11.1"
candle-nn = "0.11.1"
candle-transformers = "0.11.1"
candle-flash-attn = { version = "0.11.1", optional = true }
clap = { version = "4.6", features = ["derive", "env"] }
futures-channel = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
half = "2.7"
ntex = "4.10"
rand = "0.9"
rand_distr = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
safetensors = "0.8"
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
ureq = "2.12"
