<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Native Rust inference for Bria RMBG-3.0. Remove image backgrounds with a local CLI, web UI, or HTTP API." />
    <meta name="theme-color" content="#171a21" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f2f5fa" media="(prefers-color-scheme: light)" />
    <link rel="canonical" href="https://rembg-rs.apiplant.com/" />
    <meta property="og:site_name" content="rembg-rs" />
    <meta property="og:title" content="rembg-rs — background removal in Rust" />
    <meta property="og:description" content="Native Bria RMBG-3.0 inference with a local CLI, web UI, and HTTP API." />
    <meta property="og:url" content="https://rembg-rs.apiplant.com/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>rembg-rs — background removal in Rust</title>
    <link rel="icon" href="/mark.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      try {
        const stored = localStorage.getItem("rembg-rs-theme");
        const light = stored === "light" || (!stored && matchMedia("(prefers-color-scheme: light)").matches);
        if (light) document.documentElement.classList.add("light");
        document.documentElement.style.colorScheme = light ? "light" : "dark";
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
